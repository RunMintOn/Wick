<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wick · Paper</title>
<style>
*{box-sizing:border-box}
:root{
  --paper:#f4efe5;--paper-2:#ece5d8;--paper-3:#e7dfd0;
  --ink:#1c1a16;--ink-2:#5d564b;--ink-3:#70685a;
  --rule:#d7cbb8;--rule-2:#e3dacb;
  --amber:#a85a17;--green:#33654a;--red:#93372b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--amber);color:var(--ink);font:13px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{display:grid;grid-template-columns:266px 1fr;height:calc(100vh - 3px);margin-top:3px;background:var(--paper);overflow:hidden}
aside{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--paper-2)}
.traffic{display:flex;gap:8px;padding:19px 20px 0;height:52px;flex-shrink:0}
.traffic i{width:12px;height:12px;border-radius:50%;background:#c9bda8}
.traffic .r{background:#d98b7f}.traffic .y{background:#d8b878}.traffic .g{background:#8fb28f}
.brand{padding:0 22px 2px;flex-shrink:0}
.brand b{font:600 17px/1 var(--serif);letter-spacing:.01em}
.brand div{margin-top:7px;font:9.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
nav{flex:1;overflow:auto;min-height:0;padding:14px 0 8px;border-top:1px solid var(--rule);margin-top:12px;scrollbar-width:thin}
nav::-webkit-scrollbar{width:8px}nav::-webkit-scrollbar-thumb{background:#cbbda3}
.svc{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:baseline;gap:6px;padding:8px 22px;text-align:left;border-bottom:1px solid var(--rule-2)}
.svc:hover{background:#e9e1d2}
.svc .idx{font:italic 12px/1 var(--serif);color:var(--ink-3)}
.svc .n{font-size:13px;letter-spacing:-.005em}
.svc .st{font:9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.svc[data-s=running] .st{color:var(--green)}
.svc[data-s=partial] .st{color:var(--amber)}
.svc[data-s=failed] .st{color:var(--red)}
.svc[aria-current=true]{background:var(--paper)}
.svc[aria-current=true] .idx{color:var(--amber);font-style:normal}
.svc[aria-current=true] .n{font-weight:600}
.side-foot{padding:12px 22px 14px;border-top:1px solid var(--rule);font:9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-shrink:0}
.side-foot b{color:var(--green);font-weight:400}
.dot{width:6px;height:6px;border-radius:50%;background:#b3a894;flex-shrink:0}
.dot.running{background:var(--green)}.dot.partial{background:var(--amber)}.dot.failed{background:var(--red)}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.toolbar{height:50px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 34px;flex-shrink:0}
.crumb{font:9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.crumb b{color:var(--ink-2);font-weight:400}
.scroll{overflow:auto;padding:32px 46px 46px;min-height:0}
.wrap{max-width:740px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
h1{margin:0;font:400 42px/1 var(--serif);letter-spacing:-.018em}
.state{margin-top:10px;font:italic 14px/1 var(--serif);color:var(--ink-2);display:flex;align-items:center;gap:8px}
.state[data-s=partial]{color:var(--amber)}
.state[data-s=failed]{color:var(--red)}
.actions{display:flex;gap:0;flex-shrink:0;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.btn{height:31px;padding:0 15px;font-size:12px;letter-spacing:.01em;border-left:1px solid var(--rule);background:transparent;transition:background .12s,color .12s}
.btn:first-child{border-left:0}
.btn:hover:not(:disabled){background:var(--paper-3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{color:#b0a795;cursor:default}
.btn.primary{background:var(--ink);color:var(--paper);font-weight:600}
.btn.primary:hover{background:#000;color:var(--paper)}
.meta{margin:0;padding:0}
.def{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.def dt{font:9.5px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);width:86px;flex-shrink:0}
.def dd{margin:0;flex:1;display:flex;align-items:baseline;gap:10px;min-width:0}
.leader{flex:1;border-bottom:1px dotted #c8bca7;transform:translateY(-3px);min-width:14px}
.def .v{font:12px/1.3 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.open{font-size:12px;color:var(--amber);border-bottom:1px solid rgba(168,90,23,.4);padding-bottom:1px;white-space:nowrap}
.open:hover{border-bottom-color:var(--amber)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 0;padding-bottom:7px;border-bottom:1px solid var(--ink)}
h2{margin:0;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.sec-h span{font:italic 11px/1 var(--serif);color:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 9px 7px;text-align:left;font:9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule);border-left:1px solid var(--rule-2);font-weight:400}
th:first-child{border-left:0;padding-left:0}
td{padding:9px 9px;border-bottom:1px solid var(--rule-2);border-left:1px solid var(--rule-2);vertical-align:middle}
td:first-child{border-left:0;padding-left:0}
th.num,td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
td.th{color:var(--red)}
tr:hover td{background:#efe8da}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px}
.pill[data-s=running]{color:var(--green)}.pill[data-s=partial]{color:var(--amber)}.pill[data-s=failed]{color:var(--red)}
td .mini{font:11px/1 var(--mono);color:var(--ink-3);margin-left:8px}
.row-act{text-align:right;white-space:nowrap}
.row-act button{font:10.5px/1 var(--mono);color:var(--ink-3);padding:3px 0 3px 10px;letter-spacing:.04em;border-bottom:1px solid transparent}
.row-act button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.note{margin-top:16px;padding:11px 0 11px 14px;border-left:2px solid var(--amber);font-size:12.5px;line-height:1.5;color:#4a4237}
.note b{color:var(--ink)}
.note code{font:11.5px var(--mono);background:#e9e1d2;padding:1px 4px;border-radius:2px}
.auto{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-top:32px;padding-top:16px;border-top:1px solid var(--ink)}
.auto .l{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.auto .hint{margin-top:5px;font:italic 12px/1.4 var(--serif);color:var(--ink-3)}
.cb{width:15px;height:15px;border:1px solid var(--ink);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent}
.cb[aria-checked=true]{background:var(--ink);color:var(--paper)}
.cb svg{opacity:0}
.cb[aria-checked=true] svg{opacity:1}
.logs{margin-top:14px}
.login-line{display:flex;align-items:baseline;justify-content:space-between;margin-top:28px;padding-top:14px;border-top:1px solid var(--rule)}
.login-line h2{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:0}
.login-line .open{font-size:10.5px;font-family:var(--mono);letter-spacing:.06em}
.logs pre{max-height:190px;overflow:auto;margin:0;padding:12px 0;font:11.5px/1.7 var(--mono);color:#3f382e;white-space:pre-wrap}
.logs pre i{font-style:normal;color:var(--red)}
.logs pre s{text-decoration:none;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="brand"><b>Wick</b><div>Local service register</div></div>
    <nav id="list" aria-label="Services"></nav>
    <div class="side-foot"><span class="dot running"></span><span>background</span><b>connected</b></div>
  </aside>
  <main>
    <div class="toolbar">
      <div class="crumb">Services · <b id="crumb"></b></div>
      <button class="open" id="refresh">Refresh</button>
    </div>
    <div class="scroll"><div class="wrap" id="detail"></div></div>
  </main>
</div>
<script>
const LOGS={
  "chat-web":["10:41:02  ready  listening on 127.0.0.1:3000","10:41:02  info   websocket gateway attached","10:46:18  info   3 clients connected"],
  "chat-worker":["10:41:03  info   starting worker on 127.0.0.1:3001","10:41:03  error  bind EADDRINUSE 127.0.0.1:3001","10:41:05  info   retry 1/3 after 2s","10:41:07  error  bind EADDRINUSE 127.0.0.1:3001","10:41:09  info   retry 2/3 after 2s","10:41:11  error  bind EADDRINUSE 127.0.0.1:3001","10:41:13  info   retry 3/3 after 2s","10:41:15  error  bind EADDRINUSE 127.0.0.1:3001","10:41:15  fatal  retry budget used, exit 1"],
  "chat-tunnel":["10:41:02  ready  https://unichat.tail5dceb8.ts.net","10:46:31  info   heartbeat ok"],
  "neko":["10:41:02  info   listening on 127.0.0.1:7301","10:44:10  info   proxy: 12 upstreams loaded","10:46:02  info   heartbeat ok"],
  "dsh-web":["10:34:02  info   last exit 0 after SIGTERM"]
};
const SVC=[
 {name:"Neko Master",status:"running",url:"http://127.0.0.1:7301",autostart:true,uptime:"3d 4h",retries:0,processes:[{id:"neko",title:"Neko Master",status:"running",pid:3120,cpu:1.4,rss:118,ready:"Ready"}]},
 {name:"BookOrbit",status:"stopped",url:"http://127.0.0.1:5180",autostart:false,uptime:"",retries:0,exit:0,processes:[{id:"bookorbit",title:"BookOrbit",status:"stopped",exit:0,retries:0}]},
 {name:"dsh",status:"stopped",url:"https://macbook-pro.tail5dceb8.ts.net",autostart:false,uptime:"",retries:0,processes:[
   {id:"dsh-web",title:"dsh Web",status:"stopped",exit:0,retries:0},
   {id:"dsh-scheduler",title:"dsh Scheduler",status:"stopped",exit:0,retries:0},
   {id:"dsh-tunnel",title:"dsh Tunnel",status:"stopped",exit:0,retries:0}]},
 {name:"UniChat",status:"partial",url:"https://unichat.tail5dceb8.ts.net",autostart:true,uptime:"",retries:3,processes:[
   {id:"chat-web",title:"chat-web",status:"running",pid:4812,cpu:2.1,rss:84,ready:"Ready"},
   {id:"chat-worker",title:"chat-worker",status:"failed",exit:1,retries:3,error:"EADDRINUSE :3001"},
   {id:"chat-tunnel",title:"chat-tunnel",status:"running",pid:4839,cpu:0.3,rss:22,ready:"Ready"}]},
 {name:"Memos",status:"stopped",url:"http://127.0.0.1:5230",autostart:true,uptime:"",retries:0,exit:0,processes:[{id:"memos",title:"Memos",status:"stopped",exit:0,retries:0}]},
 {name:"CV Studio",status:"running",url:"http://127.0.0.1:7860",autostart:false,uptime:"12h 08m",retries:0,processes:[{id:"cv",title:"CV Studio",status:"running",pid:2214,cpu:6.8,rss:302,ready:"Ready"}]},
 {name:"Quick Reading",status:"running",url:"http://127.0.0.1:4321",autostart:true,uptime:"3d 4h",retries:0,processes:[{id:"qr",title:"Quick Reading",status:"running",pid:9021,cpu:0.2,rss:46,ready:"Ready"}]},
 {name:"Ziqian Blog",status:"running",url:"http://127.0.0.1:1313",autostart:true,uptime:"3d 4h",retries:0,processes:[{id:"blog",title:"Ziqian Blog",status:"running",pid:1888,cpu:0.4,rss:74,ready:"Ready"}]},
 {name:"WeChat Download API",status:"stopped",url:"http://127.0.0.1:8021",autostart:false,uptime:"",retries:0,exit:1,processes:[{id:"wc",title:"WeChat Download API",status:"stopped",exit:1,retries:0}]},
 {name:"PhraseVault Mobile",status:"running",url:"http://127.0.0.1:8787",autostart:false,uptime:"2d 11h",retries:0,processes:[{id:"pv",title:"PhraseVault Mobile",status:"running",pid:6440,cpu:0.9,rss:63,ready:"Ready"}]},
 {name:"RSS Harbor",status:"running",url:"http://127.0.0.1:1200",autostart:true,uptime:"6h 21m",retries:0,processes:[{id:"rss",title:"RSS Harbor",status:"running",pid:5122,cpu:1.1,rss:88,ready:"Ready"}]}
];
const LABEL={running:"Running",partial:"Partially running",stopped:"Stopped",failed:"Failed",starting:"Starting"};
const SHORT={running:"run",partial:"partial",stopped:"stop",failed:"fail"};
const $=s=>document.querySelector(s);
let selected="UniChat",logFor="";
const def=(k,v)=>`<div class="def"><dt>${k}</dt><dd><span class="leader"></span><span class="v">${v}</span></dd></div>`;
function logsBlock(s){
  const p=s.processes.find(p=>p.id===logFor);if(!p)return "";
  const lines=(LOGS[p.id]||["10:41:02  info   last exit 0 after SIGTERM","10:34:02  info   service stopped by console"]).map(l=>l.replace(/\b(error|fatal)\b/g,"<i>$1</i>").replace(/^\d\d:\d\d:\d\d/,"<s>$&</s>"));
  return `<div class="logs"><pre>${lines.join("\n")}</pre></div>`;
}
function renderDetail(){
  const s=SVC.find(x=>x.name===selected);
  const anyRunning=s.processes.some(p=>p.status==="running");
  const grouped=s.processes.length>1;
  $("#crumb").textContent=s.name;
  document.title=`Wick · ${s.name}`;
  const addr=`<div class="def"><dt>Address</dt><dd><span class="leader"></span><span class="v">${s.url}</span><button class="open">Open in Browser ↗</button></dd></div>`;
  const facts=grouped?[
    ["Processes",`${s.processes.filter(p=>p.status==="running").length} of ${s.processes.length} running`]
  ]:anyRunning?[
    ["PID",s.processes[0].pid],["CPU",s.processes[0].cpu.toFixed(1)+"%"],["Memory",s.processes[0].rss+" MiB"],["Uptime",s.uptime]
  ]:[
    ["Exit code",s.exit??"–"],["Restarts",s.retries],["Last seen","just now"]
  ];
  $("#detail").innerHTML=`
    <div class="head">
      <div><h1>${s.name}</h1><div class="state" data-s="${s.status}"><i class="dot ${s.status}"></i>${LABEL[s.status]}</div></div>
      <div class="actions">
        <button class="btn ${s.status!=="running"?"primary":""}" ${s.status==="running"?"disabled":""}>Start</button>
        <button class="btn" ${anyRunning?"":"disabled"}>Stop</button>
        <button class="btn" ${anyRunning?"":"disabled"}>Restart</button>
      </div>
    </div>
    <dl class="meta">${addr}${facts.map(f=>def(f[0],f[1])).join("")}</dl>
    ${grouped?`<div class="sec-h"><h2>Processes</h2><span>${s.processes.length} registered</span></div>
      <table><thead><tr><th>Process</th><th>State</th><th class="num">PID</th><th class="num">CPU</th><th class="num">RSS</th><th></th></tr></thead>
      <tbody>${s.processes.map(p=>`<tr>
        <td class="nm">${p.title}</td>
        <td><span class="pill" data-s="${p.status}"><i class="dot ${p.status}"></i>${LABEL[p.status]}</span>${p.error?`<span class="mini">${p.error}</span>`:""}</td>
        <td class="num">${p.pid??"–"}</td>
        <td class="num">${p.cpu!==undefined?p.cpu.toFixed(1)+"%":"–"}</td>
        <td class="num">${p.rss?p.rss+" M":"–"}</td>
        <td class="row-act"><button data-p="${p.id}" data-a="logs">Logs</button><button>${p.status==="running"?"Restart":"Start"}</button></td>
      </tr>`).join("")}</tbody></table>`:""}
    ${s.status==="partial"&&s.retries>=3?`<div class="note"><b>Retry budget used (3/3).</b> chat-worker keeps exiting on <code>EADDRINUSE</code>. Free port 3001, then Start; the two running processes stay up.</div>`:""}
    <div class="auto">
      <div><div class="l">Start at login</div><div class="hint">Applies at next login. Does not change this session.</div></div>
      <button class="cb" id="sw" role="switch" aria-checked="${s.autostart}" aria-label="Start at login">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4.2 3.6 6.8 9 1.2" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
    ${grouped?"":`<div class="login-line"><h2>Recent logs</h2><button class="open" data-a="logs" data-p="${s.processes[0].id}">${logFor===s.processes[0].id?"HIDE LOGS":"SHOW LOGS"}</button></div>`}
    ${logsBlock(s)}`;
  $("#sw").onclick=e=>{s.autostart=!s.autostart;e.currentTarget.setAttribute("aria-checked",s.autostart);e.currentTarget.querySelector("svg").style.opacity=s.autostart?1:0;renderList()};
  $("#detail").querySelectorAll("[data-a=logs]").forEach(b=>b.onclick=()=>{logFor=logFor===b.dataset.p?"":b.dataset.p;renderDetail()});
}
function renderList(){
  $("#list").innerHTML=SVC.map((s,i)=>`<button class="svc" data-n="${s.name}" data-s="${s.status}" aria-current="${s.name===selected}">
    <span class="idx">${String(i+1).padStart(2,"0")}</span><span class="n">${s.name}</span><span class="st">${SHORT[s.status]}</span></button>`).join("");
  $("#list").querySelectorAll(".svc").forEach(b=>b.onclick=()=>{selected=b.dataset.n;logFor="";renderList();renderDetail()});
}
renderList();renderDetail();
</script>
</body>
</html>
