<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wick · Slate</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#191a1e;--side:#1e2025;--card:#23262c;--card-2:#202329;
  --line:#313540;--line-2:#2a2e36;
  --text:#eceef3;--text-2:#a6abb6;--text-3:#828995;
  --accent:#4c9aff;--green:#5cc08c;--amber:#d9a75f;--red:#e07a70;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{display:grid;grid-template-columns:244px 1fr;height:100vh;overflow:hidden}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.traffic{display:flex;gap:8px;padding:19px 18px 0;height:52px;flex-shrink:0}
.traffic i{width:12px;height:12px;border-radius:50%}
.traffic .r{background:#e0685d}.traffic .y{background:#dfae55}.traffic .g{background:#5cb37a}
.side-head{padding:0 18px 10px;flex-shrink:0}
.wordmark{font-size:13px;font-weight:600;letter-spacing:.02em}
.band{display:flex;gap:2px;height:4px;margin:11px 0 9px}
.band i{flex:1;min-width:3px;border-radius:2px;transform-origin:center;animation:rise .3s ease both;animation-delay:calc(var(--i) * 14ms)}
@keyframes rise{from{opacity:0;transform:scaleY(.35)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.band i{animation:none}}
.band i[data-s=running]{background:var(--green)}
.band i[data-s=partial]{background:var(--amber)}
.band i[data-s=failed]{background:var(--red)}
.band i[data-s=stopped]{background:#3c424c}
.counts{font:10.5px/1.5 var(--mono);color:var(--text-3);letter-spacing:.01em}
.counts span{white-space:nowrap}
.counts b{font-weight:400;color:var(--text-2)}
nav{flex:1;overflow:auto;min-height:0;padding:2px 8px 10px;scrollbar-width:thin}
nav::-webkit-scrollbar{width:8px}nav::-webkit-scrollbar-thumb{background:#343a44;border-radius:8px}
.svc{width:100%;display:flex;align-items:center;gap:8px;height:33px;padding:0 10px;border-radius:7px;text-align:left;font-size:13px;color:var(--text-2)}
.svc:hover{background:#252830;color:var(--text)}
.svc[aria-current=true]{background:#2b2f38;color:var(--text);box-shadow:inset 0 0 0 1px #3a404b}
.svc .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc .t{font:10px/1 var(--mono);color:var(--text-3);letter-spacing:.02em}
.svc[data-s=partial] .t{color:var(--amber)}
.svc[data-s=failed] .t{color:var(--red)}
.svc[data-s=stopped] .n{color:var(--text-3)}
.side-foot{padding:9px 18px 12px;border-top:1px solid var(--line-2);font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-shrink:0}
.side-foot b{color:var(--green);font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;background:#4d535e;flex-shrink:0}
.dot.running{background:var(--green)}.dot.partial{background:var(--amber)}.dot.failed{background:var(--red)}
.dot.starting{background:var(--amber);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;background:var(--bg)}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3)}
.crumb b{color:var(--text-2);font-weight:500}
.tools{display:flex;align-items:center;gap:12px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3)}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.conn b{font-weight:400;color:var(--text-2)}
.btn{height:27px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:#252932;font-size:12px;color:var(--text);transition:background .12s,border-color .12s,transform .06s}
.btn:hover:not(:disabled){background:#2c303a;border-color:#3a404b}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{color:#5b616c;background:#202329;border-color:#2b2f37;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08131f;font-weight:600}
.btn.primary:hover{background:#67aaff;border-color:#67aaff;color:#08131f}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover{background:#252932;color:var(--text);border-color:transparent}
.scroll{overflow:auto;padding:22px 22px 32px;min-height:0}
#detail{max-width:780px;width:100%;margin:0 auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:18px}
h1{margin:0;font-size:27px;line-height:1.15;letter-spacing:-.03em;font-weight:600}
.machine{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:7px;font:11.5px/1.4 var(--mono);color:var(--text-3)}
.machine .state{display:inline-flex;align-items:center;gap:6px;font-family:-apple-system,sans-serif;font-size:12.5px;color:var(--text-2)}
.machine .state[data-s=partial]{color:var(--amber)}
.machine .state[data-s=failed]{color:var(--red)}
.machine .state[data-s=running]{color:var(--green)}
.machine .state .dot{width:6px;height:6px}
.machine .sep{color:#4a505b}
.machine b{font-weight:400;color:var(--text-2);font-variant-numeric:tabular-nums}
.machine .warn b{color:var(--amber)}
.actions{display:flex;gap:7px;flex-shrink:0;padding-top:3px}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:10px;margin-bottom:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:41px;padding:0 14px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row .k{font-size:12.5px;color:var(--text-2);flex-shrink:0}
.row .v{font-size:12.5px;text-align:right;min-width:0;overflow-wrap:anywhere}
.row .v.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.v-group{display:flex;align-items:center;gap:12px;justify-content:flex-end;min-width:0}
.v-group .u{font-family:var(--mono);font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{color:var(--accent);font-size:12.5px;white-space:nowrap}
.link:hover{text-decoration:underline}
.link:active{opacity:.7}
.auto-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:11px 14px}
.auto-row .l{font-size:12.5px}
.auto-row .hint{margin-top:2px;font-size:11.5px;color:var(--text-3)}
.sw{width:34px;height:20px;border-radius:20px;background:#414651;position:relative;transition:background .18s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#d8dbe2;transition:transform .18s,width .12s}
.sw[aria-checked=true]{background:#2f6f49}
.sw[aria-checked=true]::after{transform:translateX(14px);background:#eaf4ee}
.sw:active::after{width:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 8px;font-size:11px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--text-3)}
.sec-h span{font:10.5px/1 var(--mono);font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-3)}
.proc-head,.proc{display:grid;grid-template-columns:minmax(0,1fr) 158px 62px 48px 62px 92px;gap:8px;align-items:center;padding:0 14px}
.proc-head{min-height:28px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);background:var(--card-2);border-bottom:1px solid var(--line-2)}
.proc{min-height:39px;border-bottom:1px solid var(--line-2)}
.proc:last-child{border-bottom:0}
.proc:hover{background:#262a31}
.proc .nm{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px}
.proc .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc .st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);min-width:0}
.proc .st[data-s=failed]{color:var(--red)}
.proc .st .why{font-family:var(--mono);font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc .num{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--text-3);font-variant-numeric:tabular-nums}
.proc-head .num{text-align:right}
.proc .act{display:flex;justify-content:flex-end;gap:2px;opacity:0}
.proc:hover .act,.proc:focus-within .act{opacity:1}
.proc .act button{font-size:11.5px;color:var(--accent);padding:2px 5px;border-radius:4px;white-space:nowrap}
.proc .act button:hover{background:rgba(76,154,255,.14)}
.proc .act.keep{opacity:1}
.alert{padding:8px 14px;background:#2a2519;border-top:1px solid #3a3222;font-size:11.5px;line-height:1.55;color:#d9c19a}
.alert b{font-weight:600;color:var(--amber)}
.alert code{font-family:var(--mono);font-size:11px}
.logs-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line-2);font:11px/1.4 var(--mono);color:var(--text-3)}
.logs-h b{font-weight:400;color:var(--text-2)}
.logs-h button{font:11px/1 var(--mono);color:var(--text-3)}
.logs-h button:hover{color:var(--text)}
.logs pre,.card pre.plain{border-top:1px solid var(--line-2)}pre.plain{margin:0;padding:10px 14px 12px;max-height:190px;overflow:auto;font:11.5px/1.65 var(--mono);color:#a9b3c1;white-space:pre-wrap}
.logs pre i,.card pre.plain i{font-style:normal;color:var(--red)}
.logs pre s,.card pre.plain s{text-decoration:none;color:#5f6672}
.foot{font-size:11.5px;color:var(--text-3);margin:2px 2px 0;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="side-head">
      <div class="wordmark">Wick</div>
      <div class="band" id="band" aria-hidden="true"></div>
      <div class="counts" id="counts"></div>
    </div>
    <nav id="list" aria-label="Services"></nav>
  </aside>
  <main>
    <div class="toolbar">
      <div class="crumb"><span>Services</span><span>/</span><b id="crumb"></b></div>
      <div class="tools"><span class="conn"><i></i>Background <b>connected</b></span><button class="btn" id="refresh">Refresh</button></div>
    </div>
    <div class="scroll"><div id="detail"></div></div>
  </main>
</div>
<script>
const LOGS={
  "chat-web":["10:41:02  ready  listening on 127.0.0.1:3000","10:41:02  info   websocket gateway attached","10:46:18  info   3 clients connected"],
  "chat-worker":["10:41:03  info   starting worker on 127.0.0.1:3001","10:41:03  error  bind EADDRINUSE 127.0.0.1:3001","10:41:05  info   retry 1/3 after 2s","10:41:07  error  bind EADDRINUSE 127.0.0.1:3001","10:41:09  info   retry 2/3 after 2s","10:41:11  error  bind EADDRINUSE 127.0.0.1:3001","10:41:13  info   retry 3/3 after 2s","10:41:15  error  bind EADDRINUSE 127.0.0.1:3001","10:41:15  fatal  retry budget used, exit 1"],
  "chat-tunnel":["10:41:02  ready  https://unichat.tail5dceb8.ts.net","10:46:31  info   heartbeat ok"],
  "neko":["10:41:02  info   listening on 127.0.0.1:7301","10:44:10  info   proxy: 12 upstreams loaded","10:46:02  info   heartbeat ok"],
  "dsh-web":["10:34:02  info   last exit 0 after SIGTERM"]
};
const SVC=[
 {name:"Neko Master",status:"running",url:"http://127.0.0.1:7301",autostart:true,uptime:"3d 4h",retries:0,processes:[{id:"neko",title:"Neko Master",status:"running",pid:3120,cpu:1.4,rss:118,ready:"Ready"}]},
 {name:"BookOrbit",status:"stopped",url:"http://127.0.0.1:5180",autostart:false,uptime:"",retries:0,exit:0,processes:[{id:"bookorbit",title:"BookOrbit",status:"stopped",exit:0,retries:0}]},
 {name:"dsh",status:"stopped",url:"https://macbook-pro.tail5dceb8.ts.net",autostart:false,uptime:"",retries:0,processes:[
   {id:"dsh-web",title:"dsh Web",status:"stopped",exit:0,retries:0},
   {id:"dsh-scheduler",title:"dsh Scheduler",status:"stopped",exit:0,retries:0},
   {id:"dsh-tunnel",title:"dsh Tunnel",status:"stopped",exit:0,retries:0}]},
 {name:"UniChat",status:"partial",url:"https://unichat.tail5dceb8.ts.net",autostart:true,uptime:"",retries:3,processes:[
   {id:"chat-web",title:"chat-web",status:"running",pid:4812,cpu:2.1,rss:84,ready:"Ready"},
   {id:"chat-worker",title:"chat-worker",status:"failed",exit:1,retries:3,error:"EADDRINUSE :3001"},
   {id:"chat-tunnel",title:"chat-tunnel",status:"running",pid:4839,cpu:0.3,rss:22,ready:"Ready"}]},
 {name:"Memos",status:"stopped",url:"http://127.0.0.1:5230",autostart:true,uptime:"",retries:0,exit:0,processes:[{id:"memos",title:"Memos",status:"stopped",exit:0,retries:0}]},
 {name:"CV Studio",status:"running",url:"http://127.0.0.1:7860",autostart:false,uptime:"12h 08m",retries:0,processes:[{id:"cv",title:"CV Studio",status:"running",pid:2214,cpu:6.8,rss:302,ready:"Ready"}]},
 {name:"Quick Reading",status:"running",url:"http://127.0.0.1:4321",autostart:true,uptime:"3d 4h",retries:0,processes:[{id:"qr",title:"Quick Reading",status:"running",pid:9021,cpu:0.2,rss:46,ready:"Ready"}]},
 {name:"Ziqian Blog",status:"running",url:"http://127.0.0.1:1313",autostart:true,uptime:"3d 4h",retries:0,processes:[{id:"blog",title:"Ziqian Blog",status:"running",pid:1888,cpu:0.4,rss:74,ready:"Ready"}]},
 {name:"WeChat Download API",status:"stopped",url:"http://127.0.0.1:8021",autostart:false,uptime:"",retries:0,exit:1,processes:[{id:"wc",title:"WeChat Download API",status:"stopped",exit:1,retries:0}]},
 {name:"PhraseVault Mobile",status:"running",url:"http://127.0.0.1:8787",autostart:false,uptime:"2d 11h",retries:0,processes:[{id:"pv",title:"PhraseVault Mobile",status:"running",pid:6440,cpu:0.9,rss:63,ready:"Ready"}]},
 {name:"RSS Harbor",status:"running",url:"http://127.0.0.1:1200",autostart:true,uptime:"6h 21m",retries:0,processes:[{id:"rss",title:"RSS Harbor",status:"running",pid:5122,cpu:1.1,rss:88,ready:"Ready"}]}
];
if(new URLSearchParams(location.search).get("many")){
  for(let i=0;i<29;i++){
    const status=i%11===3?"partial":i%7===4?"failed":i%5===1?"stopped":"running";
    const nm=`Worker ${String(i+1).padStart(2,"0")}`;
    const procs=status==="partial"
      ? [{id:"w"+i+"a",title:nm+" Web",status:"running",pid:6000+i,cpu:0.4,rss:38,ready:"Ready"},{id:"w"+i+"b",title:nm+" Worker",status:"failed",exit:1,retries:0}]
      : [{id:"w"+i,title:nm,status:status==="failed"?"failed":status,exit:status==="stopped"?0:1,pid:status==="running"?6000+i:undefined,cpu:0.4,rss:38,ready:"Ready"}];
    SVC.push({name:nm,status,url:"http://127.0.0.1:9000",autostart:false,uptime:"2h 05m",retries:0,processes:procs});
  }
}
const LABEL={running:"Running",partial:"Partially running",stopped:"Stopped",failed:"Failed",starting:"Starting"};
const $=s=>document.querySelector(s);
let selected="UniChat",logFor="";
const row=(k,v)=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
function lines(id){
  return (LOGS[id]||["10:41:02  info   last exit 0 after SIGTERM","10:34:02  info   service stopped by console"])
    .map(l=>l.replace(/\b(error|fatal)\b/g,"<i>$1</i>").replace(/^\d\d:\d\d:\d\d/,"<s>$&</s>")).join("\n");
}
function logs(s){
  const p=s.processes.find(p=>p.id===logFor);if(!p)return "";
  return `<div class="card logs"><div class="logs-h"><span>tail <b>${p.title}</b> · 50 lines</span><button data-a="close">close</button></div><pre>${lines(p.id)}</pre></div>`;
}
function renderDetail(){
  const s=SVC.find(x=>x.name===selected);
  const anyRunning=s.processes.some(p=>p.status==="running");
  const grouped=s.processes.length>1;
  const one=s.processes[0];
  const failing=s.processes.filter(p=>p.status==="failed").length;
  const up=s.processes.filter(p=>p.status==="running").length;
  $("#crumb").textContent=s.name;
  document.title=`Wick · ${s.name}`;
  const bits=[`<span class="state" data-s="${s.status}"><i class="dot ${s.status}"></i>${LABEL[s.status]}</span>`];
  if(grouped){
    bits.push(`<span>${s.processes.length} processes</span>`);
    bits.push(`<span class="${failing?"warn":""}"><b>${up}</b> up</span>`);
    if(failing)bits.push(`<span class="warn"><b>${failing}</b> failing</span>`);
    if(s.retries)bits.push(`<span class="warn">retries ${s.retries}/3</span>`);
  }else{
    bits.push(`<span>1 process</span>`);
    if(anyRunning)bits.push(`<span>up ${s.uptime}</span>`);
    else if(s.exit!==undefined)bits.push(`<span>exit <b>${s.exit}</b></span>`);
  }
  $("#detail").innerHTML=`
    <div class="head">
      <div><h1>${s.name}</h1><div class="machine">${bits.join('<span class="sep">·</span>')}</div></div>
      <div class="actions">
        <button class="btn ${s.status!=="running"?"primary":""}" ${s.status==="running"?"disabled":""}>Start</button>
        <button class="btn" ${anyRunning?"":"disabled"}>Stop</button>
        <button class="btn" ${anyRunning?"":"disabled"}>Restart</button>
      </div>
    </div>
    <div class="card">
      ${grouped?"":`${row("PID",`<span class="mono">${anyRunning?one.pid:"–"}</span>`)}
      ${row("CPU",`<span class="mono">${anyRunning?one.cpu.toFixed(1)+"%":"–"}</span>`)}
      ${row("Memory",`<span class="mono">${anyRunning?one.rss+" MiB":"–"}</span>`)}
      ${row(anyRunning?"Uptime":"Exit code",`<span class="mono">${anyRunning?s.uptime:s.exit??"–"}</span>`)}`}
      <div class="row"><span class="k">Address</span><span class="v-group"><span class="u">${s.url}</span><button class="link">Open in Browser ↗</button></span></div>
      <div class="auto-row"><div><div class="l">Start at login</div><div class="hint">Applies at next login. Does not change this session.</div></div><button class="sw" id="sw" role="switch" aria-checked="${s.autostart}" aria-label="Start at login"></button></div>
    </div>
    ${grouped?`<div class="sec-h">Processes<span>${up} of ${s.processes.length} running</span></div>
      <div class="card">
        <div class="proc-head"><div>Process</div><div>State</div><div class="num">PID</div><div class="num">CPU</div><div class="num">RSS</div><div></div></div>
        ${s.processes.map(p=>`<div class="proc">
          <div class="nm"><i class="dot ${p.status}"></i><span>${p.title}</span></div>
          <div class="st" data-s="${p.status}">${LABEL[p.status]}${p.error?`<span class="why">${p.error}</span>`:""}</div>
          <div class="num">${p.pid??"–"}</div>
          <div class="num">${p.cpu!==undefined?p.cpu.toFixed(1)+"%":"–"}</div>
          <div class="num">${p.rss?p.rss+" M":"–"}</div>
          <div class="act ${p.status==="failed"?"keep":""}"><button>${p.status==="running"?"Restart":"Start"}</button><button data-a="logs" data-p="${p.id}">Logs</button></div>
        </div>`).join("")}
        ${s.status==="partial"&&s.retries>=3?`<div class="alert"><b>Retry budget used (3/3).</b> chat-worker keeps exiting on <code>EADDRINUSE :3001</code>. Free the port, then Start. Running processes stay up.</span></div>`:""}
      </div>`:`<div class="card"><div class="row"><span class="k">Recent logs</span><span class="v"><button class="link" data-a="logs" data-p="${one.id}">${logFor===one.id?"Hide logs":"Show logs"}</button></span></div>${logFor?`<pre class="plain">${lines(one.id)}</pre>`:""}</div>`}
    ${grouped?logs(s):""}
    ${grouped?`<p class="foot">Start waits for healthy dependencies. Stop runs in reverse order.</p>`:""}`;
  $("#sw").onclick=e=>{s.autostart=!s.autostart;e.currentTarget.setAttribute("aria-checked",s.autostart)};
  $("#detail").querySelectorAll("[data-a=logs]").forEach(b=>b.onclick=()=>{logFor=logFor===b.dataset.p?"":b.dataset.p;renderDetail()});
  $("#detail").querySelector("[data-a=close]")?.addEventListener("click",()=>{logFor="";renderDetail()});
  if(logFor)$("#detail").querySelector("pre")?.scrollIntoView({block:"nearest"});
}
function renderSide(){
  const n={running:0,partial:0,failed:0,stopped:0};
  SVC.forEach(s=>n[s.status]=(n[s.status]||0)+1);
  $("#list").innerHTML=SVC.map(s=>`<button class="svc" data-n="${s.name}" data-s="${s.status}" aria-current="${s.name===selected}">
    <i class="dot ${s.status}"></i><span class="n">${s.name}</span><span class="t">${s.status==="partial"?`${s.processes.filter(p=>p.status==="running").length}/${s.processes.length}`:s.status==="failed"?"fail":""}</span></button>`).join("");
  $("#list").querySelectorAll(".svc").forEach(b=>b.onclick=()=>{selected=b.dataset.n;logFor="";renderSide();renderDetail()});
  const many=SVC.length>18;
  $("#band").innerHTML=(many
    ? [["running",n.running],["partial",n.partial],["failed",n.failed],["stopped",n.stopped]].filter(g=>g[1])
        .map((g,i)=>`<i data-s="${g[0]}" style="flex:${g[1]};--i:${i}"></i>`).join("")
    : SVC.map((s,i)=>`<i data-s="${s.status}" style="flex:1;--i:${i}"></i>`).join(""));
  const rest=[];
  if(n.partial)rest.push(`<span><b>${n.partial}</b> partial</span>`);
  if(n.failed)rest.push(`<span><b>${n.failed}</b> failed</span>`);
  if(n.stopped)rest.push(`<span><b>${n.stopped}</b> stopped</span>`);
  $("#counts").innerHTML=`<b>${n.running}</b> running of ${SVC.length}${rest.length?`<br>${rest.join(" · ")}`:""}`;
}
renderSide();renderDetail();
</script>
</body>
</html>
